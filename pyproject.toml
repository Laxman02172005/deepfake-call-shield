[project]
name = "deepfake-call-shield"
version = "0.1.0"
description = "Speech deepfake detection using pretrained frozen encoders, evaluated for robustness to phone-like audio degradation."
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
